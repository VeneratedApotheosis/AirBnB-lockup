<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library events | Accessibility demo fixture</title>
</head>
<body>
  <main>
    <h1>Library events</h1>
    <h3>Find an event</h3>
    <form role="search" action="/">
      <label for="query">Event name</label>
      <input id="query" name="q" type="search">
      <button type="submit">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="10" cy="10" r="6"></circle>
          <path d="m14 14 6 6"></path>
        </svg>
      </button>
    </form>
    <figure>
      <img width="120" height="60" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 60'%3E%3Crect width='120' height='60' fill='%23f5dca8'/%3E%3Ctext x='10' y='35' font-size='15'%3EBook swap%3C/text%3E%3C/svg%3E">
      <figcaption>Saturday book swap poster</figcaption>
    </figure>
  </main>
</body>
</html>
