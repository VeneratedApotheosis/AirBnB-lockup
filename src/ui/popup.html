<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Accessibility Fixer</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="./index.ts"></script>
</head>
<body>
  <main data-ui>
    <header class="masthead">
      <h1>Website Accessibility Fixer</h1>
    </header>

    <section aria-labelledby="page-heading">
      <div class="section-heading">
        <h2 id="page-heading">Current page</h2>
        <button id="revert" class="quiet" type="button">Undo fixes</button>
      </div>
      <p id="status" class="status" role="status">Scan for barriers on the current page.</p>
      <button id="scan" class="button primary" type="button">Scan this page</button>

      <section id="review" aria-labelledby="review-heading" hidden>
        <h3 id="review-heading">Suggested fixes</h3>
        <p id="review-note" class="muted"></p>
        <fieldset id="choices">
          <legend class="visually-hidden">Fixes to apply</legend>
          <ul id="proposals" class="rows"></ul>
        </fieldset>
        <button id="apply" class="button primary" type="button" disabled>Apply selected fixes</button>
      </section>

      <details id="findings" hidden>
        <summary id="findings-label">Findings</summary>
        <ul id="findings-list" class="rows"></ul>
      </details>
    </section>

    <section class="settings" aria-labelledby="settings-heading">
      <h2 id="settings-heading">Settings</h2>
      <label for="settings-search">Search settings</label>
      <input id="settings-search" type="search" placeholder="Search by name or description">
      <p id="settings-results" class="visually-hidden" role="status"></p>
      <fieldset id="profiles" disabled>
        <legend class="visually-hidden">Preferred accessibility profile</legend>
        <div id="profile-options" class="rows"></div>
      </fieldset>
      <p id="settings-status" class="muted status" role="status">Loading settings…</p>
    </section>
  </main>
</body>
</html>
